analyzer:
  exclude:
    - build/**
    - android/**
    - ios/**
    - web/**
    - windows/**
    - macos/**
    - linux/**
include: package:flutter_lints/flutter.yaml

linter:
  rules:
    # Konstruktor AuthProvider-a namjerno mapira javne parametre na privatna polja
    # kako pozivatelj ne bi ovisio o internim nazivima.
    prefer_initializing_formals: false
