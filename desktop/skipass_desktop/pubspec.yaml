name: skipass_desktop
description: SkiPass - desktop aplikacija za administraciju skijalista.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.13.0

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.8
  collection: ^1.19.1
  http: ^1.5.0
  provider: ^6.1.5
  shared_preferences: ^2.5.3
  intl: ^0.20.2
  file_selector: ^1.0.3
  fl_chart: ^0.69.2
  pdf: ^3.11.3
  printing: ^5.13.4
  path_provider: ^2.1.5
  camera: ^0.11.1
  camera_windows: ^0.2.5
  flutter_zxing: ^2.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  generate: true
